[pytest]
# Run tests from the app/ folder; pythonpath lets "import common / agent / servers" work.
pythonpath = .
testpaths = tests
asyncio_mode = auto
# One event loop for the whole session so the 3 MCP servers can be started ONCE and shared (fast tests).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
